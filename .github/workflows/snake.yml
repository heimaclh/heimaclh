name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"      # 每天 UTC 00:00(北京时间早上 8 点)自动更新
  workflow_dispatch:          # 允许在 Actions 页面手动触发
  push:
    branches:
      - main                  # 每次推送到 main 也自动更新(默认分支是 master 就改成 master)

permissions:
  contents: write             # 允许工作流把生成的 SVG 推到 output 分支

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 生成贪吃蛇 SVG(明暗两套配色)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake-light.svg?palette=github-light

      - name: 推送到 output 分支
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
